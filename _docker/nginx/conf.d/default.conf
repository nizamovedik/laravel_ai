# Перенаправление с HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nizamov-eduard.ru www.nizamov-eduard.ru;

    return 301 https://$host$request_uri;
}

# Основной сервер с поддержкой HTTPS и SSL
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nizamov-eduard.ru www.nizamov-eduard.ru;

    root /var/www/public;
    index index.php index.html;

    # Пути к сертификатам (из вашего docker-compose.yml)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Рекомендуемые настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Логи (полезно для отладки)
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Обработка PHP-FPM (Laravel)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Запрет доступа к скрытым файлам (например, .env или .git)
    location ~ /\. {
        deny all;
    }
}
